name: '[Sécurix] Garbage collect documentation previews'

on:
  pull_request:
    types:
      - closed

permissions: {}

concurrency:
  group: preview-pages-${{ github.ref }}

jobs:
  clean-up:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        # zizmor: ignore[artipacked] - the persisted credential is required to
        # `git push` the cleaned-up gh-pages branch back to the remote.
        with:
          ref: gh-pages

      - name: Clean up
        run: |
          rm -rf pr-${{ github.event.number }}
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Clean preview for pr-${{ github.event.number }}"
            git push
          fi
